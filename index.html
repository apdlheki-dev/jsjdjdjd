<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مولد حسابات تجريبية</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, select, button { display: block; width: 100%; margin: 10px 0; padding: 8px; }
        #output { background: #f4f4f4; padding: 10px; white-space: pre-wrap; margin-top: 20px; border: 1px dashed #999; }
    </style>
</head>
<body>

<div class="container">
    <h2>مولد الحسابات التجريبية</h2>
    <label>عدد الحسابات:</label>
    <input type="number" id="count" value="5" min="1" max="50">
    
    <label>نوع البريد:</label>
    <select id="emailType">
        <option value="outlook">Outlook</option>
        <option value="hotmail">Hotmail</option>
        <option value="both">كلاهما</option>
    </select>
    
    <button onclick="generate()">توليد الحسابات</button>
    
    <div id="output"></div>
</div>

<script>
function generate() {
    const count = document.getElementById('count').value;
    const emailType = document.getElementById('emailType').value;
    const output = document.getElementById('output');
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let results = "";

    for (let i = 0; i < count; i++) {
        let username = "";
        for (let j = 0; j < 7; j++) username += chars.charAt(Math.floor(Math.random() * chars.length));
        
        let password = "";
        for (let j = 0; j < 10; j++) password += chars.charAt(Math.floor(Math.random() * chars.length));
        
        let domain = emailType === 'both' ? (Math.random() > 0.5 ? 'outlook.com' : 'hotmail.com') : emailType + '.com';
        results += `${username}@${domain} | كلمة السر: ${password}\n`;
    }
    output.innerText = results;
}
</script>

</body>
</html>
